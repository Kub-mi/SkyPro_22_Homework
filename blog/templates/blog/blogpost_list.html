{% extends "base.html" %}
{% block content %}
  <h1>Блог</h1>
  {% for post in posts %}
    <h2><a href="{% url 'blog:detail' post.pk %}">{{ post.title }}</a></h2>
    <p>{{ post.created_at }} | Просмотры: {{ post.views_count }}</p>
  {% endfor %}
  <a href="{% url 'blog:create' %}">Создать новую запись</a>
{% endblock %}
