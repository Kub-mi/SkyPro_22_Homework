{% extends "base.html" %}
{% block content %}
  <h1>{{ post.title }}</h1>
  <img src="{{ post.preview.url }}" alt="" width="300" />
  <p>{{ post.content }}</p>
  <p>Просмотров: {{ post.views_count }}</p>
  <a href="{% url 'blog:update' post.pk %}">Редактировать</a> |
  <a href="{% url 'blog:delete' post.pk %}">Удалить</a> |
  <a href="{% url 'blog:list' %}">Назад</a>
{% endblock %}
