{% extends 'catalog/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<h1>Добавить товар</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Название товара:</label><br>
    <input type="text" placeholder="апельсин" name="name"><br>

    <label>Описание:</label><br>
    <textarea name="description" placeholder="Описание продукта"></textarea><br>

    <label>Изображение:</label><br>
    <input type="file" name="image"><br>

    <label>Категория:</label><br>
    <select name="category">
        {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
    </select><br>

    <label>Цена:</label><br>
    <input type="number" step="0.01" name="price" placeholder="10.50"><br><br>

    {% if user.is_authenticated %}
        <button type="submit">Сохранить</button>
    {% endif %}

</form>
{% endblock %}
