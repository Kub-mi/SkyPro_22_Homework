{% extends 'catalog/base.html' %}
{% block title %}Удаление продукта{% endblock %}

{% block content %}
<h1>Удалить продукт «{{ object.name }}»?</h1>
<form method="post">
  {% csrf_token %}
  {% if user.is_authenticated %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'catalog:product_detail' object.pk %}">Отмена</a>
  {% endif %}
</form>
{% endblock %}
